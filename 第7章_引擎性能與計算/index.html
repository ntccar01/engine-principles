<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>單元七｜引擎性能與計算</title><link rel="stylesheet" href="chapter7.css">
<style>
main{max-width:1500px;padding:14px 24px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.top h1{font-size:28px;margin:0}.top .stuid{margin-left:auto;font-size:17px}
.chnav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;font-size:16px}
.chnav a{padding:4px 12px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--mut)}
.chnav a.on{background:var(--acc);color:#171100;border-color:var(--acc);font-weight:bold}.chnav a:hover{border-color:var(--acc)}
.unit{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.lessons{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.les{display:grid;grid-template-columns:260px 1fr;gap:6px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;scroll-margin-top:10px}
.les.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.les .tag{font-size:16px;margin:0}.les h2{font-size:24px;margin:2px 0 0;cursor:pointer}.les .meta{font-size:15px;margin:2px 0 0}
.rowb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowb .lab{width:3.2em;font-size:15px;color:var(--mut)}
.rowb .btn{font-size:17px;padding:7px 12px;position:relative}
.rowb.after .btn{background:transparent}
.btn .st{font-size:13px;margin-left:6px;color:var(--ok);font-weight:bold}.btn .st.as{color:#ffb020}
.foot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;margin-top:14px;font-size:15px}
.foot a{color:var(--mut)}
@media(max-width:900px){.les{grid-template-columns:1fr}.top .stuid{margin-left:0}}
</style>
<body><main>
<div class="top"><h1>第7章：引擎性能與計算</h1><span class="mut">單元七｜5 節・全課程第 34～38 節</span><span class="stuid" id="stu"></span></div>
<nav class="chnav" aria-label="其他章節"><a href="../index.html">🏠 全課程</a><a href="../ch1.html">第1章</a><a href="../ch2.html">第2章</a><a href="../第3章_汽油引擎燃料系統/index.html">第3章</a><a href="../第4章_潤滑系統/index.html">第4章</a><a href="../第5章_冷卻系統/index.html">第5章</a><a href="../第6章_點火系統/index.html">第6章</a><a class="on" href="index.html" aria-current="page">第7章</a></nav>
<div class="lessons" id="lessons"></div>
<div class="unit"><a class="btn pri" href="Q_單元七測驗.html">📝 單元七測驗（100 分）</a><span id="st_unit" class="ok"></span><span class="mut">上課順序：S 簡報 → V 動畫 → 互學挑戰 → 學習單 → 隨堂測驗；缺課同學用「補課包」。點節次標題可把那一節標成今天上課。</span></div>
<div class="foot"><span class="mut" id="pend"></span><a href="教師專區.html">教師專區</a></div>
</main>
<script src="links.js"></script><script src="firebase-config.js"></script><script src="student.js"></script><script src="score.js"></script>
<script>
const L = [
  [1, '課本7-1｜第34節', '基本單位與換算', '5段動畫・互學22分'],
  [2, '課本7-2｜第35節', '排氣量與壓縮比', '5段動畫・互學22分'],
  [3, '課本7-3｜第36節', '馬力與扭力', '6段動畫・互學22分'],
  [4, '課本7-4＋7-5｜第37節', '引擎效率與油耗率', '5段動畫・互學22分'],
  [5, '課本7-6＋全章統整｜第38節', '性能因素與計算統整', '5段動畫・互學22分']];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let ASSIGN = {};
const J = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
function status() {
  const s = window.Student && Student.get(), hist = J('act_history') || [], out = {};
  const best = code => hist.filter(r => r.lesson === code && (!s || r.cls === s.cls)).sort((a, b) => b.score - a.score)[0];
  for (const [n] of L) {
    const v = best('Ch7-V' + n); out['v' + n] = v ? `✓${v.score}/${v.total}` : '';
    const q = s && J(`ch7rec_Ch7-F${n}_${s.cls}_${s.seat}`); out['f' + n] = q ? `✓${q.first.score}/${q.first.total}` : '';
    const r = (s && J(`ch7review${n}_${s.cls}_${s.seat}`)) || [], rq = s && J(`ch7rec_Ch7-R${n}_${s.cls}_${s.seat}`), done = r.filter(Boolean).length;
    out['r' + n] = (ASSIGN[n] && s && ASSIGN[n].includes(s.seat) ? (done === 4 ? '' : '📌老師指定 ') : '') + (done === 4 ? '✓完成' : done ? `${done}/4步` : rq ? `測驗${rq.first.score}/${rq.first.total}` : '');
  }
  const u = s && J(`ch7rec_Unit7_${s.cls}_${s.seat}`); out.unit = u ? `✓ 已完成 ${u.first.score} 分` : '';
  return out;
}
function draw() {
  const st = status(), today = +(localStorage.getItem('ch7_today') || 0);
  const b = (href, label, key, cls = '') => `<a class="btn ${cls}" href="${href}">${label}${st[key] ? `<span class="st${/📌/.test(st[key]) ? ' as' : ''}">${esc(st[key])}</span>` : ''}</a>`;
  document.getElementById('lessons').innerHTML = L.map(([n, tag, title, meta]) => `<section class="les ${n === today ? 'on' : ''}" id="L${n}">
    <div><p class="tag">${tag}${n === today ? '　📌 今天' : ''}</p><h2 data-n="${n}" title="點一下標成今天上課">${title}</h2><p class="meta mut">${meta}・隨堂6題</p></div>
    <div><div class="rowb"><span class="lab">上課</span>${b(`S${n}_第${n}節_${title}.html`, `S${n} 上課簡報`, '', 'pri')}${b(`V${n}_${title}.html`, `V${n} 互動動畫`, '')}${b(`V${n}_${title}.html?act=1`, `🎮 互學挑戰`, 'v' + n)}${b(`W${n}_學習單.html`, `W${n} 學習單`, '')}${b(`Q${n}_隨堂測驗.html`, `✏️ F${n} 隨堂測驗`, 'f' + n)}</div>
    <div class="rowb after" style="margin-top:6px"><span class="lab">課後</span>${b(`K${n}_重點與例題.html`, '📖 重點與例題', '')}${b(`R${n}_第${n}節補課包.html`, '🩹 補課包（缺課用）', 'r' + n)}</div></div></section>`).join('');
  document.getElementById('st_unit').textContent = st.unit;
  document.querySelectorAll('.les h2').forEach(h => h.onclick = () => { const n = +h.dataset.n; try { localStorage.setItem('ch7_today', n === today ? '' : n); } catch (e) { } draw(); });
  if (today) document.getElementById('L' + today).scrollIntoView({ block: 'nearest' });
  const p = window.Score && Score.pending ? Score.pending() : 0;
  document.getElementById('pend').textContent = p ? `⚠ 這台機器有 ${p} 筆成績還沒上傳，連上網路後會自動補送。` : '';
}
function loadAssign() { const s = Student.get(); ASSIGN = {}; if (s && window.Score && Score.getAssign) Score.getAssign(s.cls).then(a => { ASSIGN = a || {}; draw(); }); }
Student.badge(document.getElementById('stu')); Student.onChange(() => { draw(); loadAssign(); }); draw(); loadAssign();
window.addEventListener('pageshow', draw);
</script></body></html>
