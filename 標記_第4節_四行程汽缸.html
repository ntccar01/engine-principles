<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第4節 四行程引擎各部位</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#1f2933; --muted:#5f6b7a; --line:#d5dbe3;
  --accent:#1f6feb; --accent-soft:#e3edff; --ok:#1a7f37; --ok-soft:#dcf5e3;
  --bad:#c62828; --bad-soft:#fde4e4; --pin:#ff8a00;
  --tag-fs:20px; --pin-size:40px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;color:var(--ink)}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#14213d;color:#fff}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
header .tabs{display:flex;gap:6px}
header .tabs button{background:transparent;color:#cfd8e6;border-color:#3a4a6b}
header .tabs button.on{background:#fff;color:#14213d;border-color:#fff}
header .pnav{display:flex;gap:8px;flex-wrap:wrap}
header .pnav button,header .pnav a{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid #5a6d94;background:#24365c;color:#fff;text-decoration:none;font-size:16px;font-weight:600;line-height:1.2}
header .pnav button:hover,header .pnav a:hover{background:#fff;color:#14213d;border-color:#fff}
main{padding:14px;max-width:1400px;margin:0 auto}
.hidden{display:none!important}

/* ---------- 共用：圖面 ---------- */
.stage{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage{display:flex;justify-content:center;align-items:flex-start}
.canvas{position:relative;display:inline-block;max-width:100%;line-height:0}
.stage img.base{display:block;max-width:100%;max-height:calc(100vh - 110px);width:auto;height:auto;pointer-events:none}
body.embed .stage img.base{max-height:calc(100vh - 30px)}
.stage .empty{padding:80px 20px;text-align:center;color:var(--muted)}
.pin{position:absolute;transform:translate(-50%,-50%);width:var(--pin-size);height:var(--pin-size);border-radius:50%;
  background:var(--pin);color:#fff;font-weight:700;font-size:calc(var(--pin-size) * .45);display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);z-index:4}
.pin.target{outline:3px dashed var(--accent);outline-offset:3px}
.pin.filled{background:var(--accent)}
#playStage .pin.todo{animation:pinPulse 1.6s ease-in-out infinite}
@keyframes pinPulse{0%,100%{box-shadow:0 1px 5px rgba(0,0,0,.45),0 0 0 0 rgba(255,138,0,.55)}50%{box-shadow:0 1px 5px rgba(0,0,0,.45),0 0 0 9px rgba(255,138,0,0)}}
@media (prefers-reduced-motion:reduce){#playStage .pin.todo{animation:none}}
.legend{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:-4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pin.ok{background:var(--ok)}
.pin.bad{background:var(--bad)}
.pin.hot{transform:translate(-50%,-50%) scale(1.25)}
.tag{position:absolute;transform:translate(-50%,calc(var(--pin-size) * .5 + 4px));z-index:3;width:max-content;max-width:11em;
  background:#fff;border:3px solid var(--accent);border-radius:10px;padding:3px 10px;font-size:var(--tag-fs);font-weight:700;line-height:1.3;
  text-align:center;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.tag.up{transform:translate(-50%,calc(-100% - var(--pin-size) * .5 - 4px))}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.anchor{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#263238;border:3px solid #fff;
  box-shadow:0 0 0 1px #263238;z-index:2;pointer-events:none}
.edit-wrap .anchor{pointer-events:auto;cursor:move;width:18px;height:18px;touch-action:none;background:#ff8a00}
.tag.left{transform:translate(calc(-100% - var(--pin-size) * .5 - 4px),-50%)}
.tag.right{transform:translate(calc(var(--pin-size) * .5 + 4px),-50%)}
.tag.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.tag.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* ---------- 作答 ---------- */
.play-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:10px}
.side h2{font-size:17px;margin:0 0 4px}
.side .inst{color:var(--muted);font-size:14px;margin:0 0 10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed var(--line);border-radius:8px}
.chip{padding:8px 14px;font-size:max(17px,calc(var(--tag-fs) * .9));border-radius:999px;background:var(--accent-soft);border:2px solid transparent;font-weight:600;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{border-color:var(--accent);background:#fff}
.ghost{position:fixed;z-index:999;pointer-events:none;padding:8px 14px;font-size:var(--tag-fs);border-radius:999px;background:var(--accent);color:#fff;
  font-weight:600;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.status{margin:10px 0;font-size:15px;min-height:24px}
.feedback{margin-top:10px;font-size:14px}
.feedback li{margin-bottom:6px}
.feedback .hint{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.done{background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:10px;margin-top:10px}
.done b{color:var(--ok)}

/* ---------- 編輯 ---------- */
.edit-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.edit-wrap .stage{cursor:crosshair}
.edit-wrap .pin{cursor:move;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel h3{font-size:15px;margin:0 0 8px}
.panel label{display:block;font-size:14px;color:var(--muted);margin:8px 0 3px}
.panel input[type=text],.panel textarea,.panel select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.panel textarea{min-height:70px;resize:vertical}
.pinrow{display:grid;grid-template-columns:30px 1fr 34px;gap:6px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.pinrow .num{width:28px;height:28px;border-radius:50%;background:var(--pin);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.pinrow .fields input{margin-bottom:4px}
.pinrow .fields select{width:auto;padding:3px 6px;font-size:13px}
.pinrow button{padding:4px 0}
.pinrow.hot{background:#fff7ea}
.tip{font-size:13px;color:var(--muted)}
.sizebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:14px;color:var(--muted)}
.sizebar .grp{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sizebar button{padding:4px 10px;font-weight:700;white-space:nowrap;min-width:40px}
.stage.zoomed{display:block;overflow:auto;max-height:78vh;-webkit-overflow-scrolling:touch}
.stage.zoomed img.base{max-width:none;max-height:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 18px;border-radius:8px;z-index:1000;font-size:14px}

/* 嵌入模式 */
body.embed header{display:none}
body.embed main{padding:8px}

@media (max-width:900px){
  .play-wrap,.edit-wrap{grid-template-columns:1fr}
  .side{position:static}
  .tag{border-width:2px;padding:2px 8px}
}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">標記圖表工具</h1>
  <div class="tabs" id="tabs">
    <button id="tabEdit" class="on">✏️ 編輯題目</button>
    <button id="tabPlay">▶ 作答預覽</button>
  </div>
  <nav class="pnav hidden" id="pageNav" aria-label="頁面導覽">
    <button type="button" id="btnBack">← 回上一頁</button>
    <a id="lnkHome" href="#" class="hidden">🏠 回首頁</a>
  </nav>
</header>

<main>
  <!-- ================= 編輯模式 ================= -->
  <section id="editView">
    <div class="edit-wrap">
      <div>
        <div class="stage" id="editStage"><div class="empty">先在右側載入底圖（SVG 或照片），再點圖面新增圈圈</div></div>
        <p class="tip">在圖上點一下＝新增圈圈；拖曳圈圈＝調整位置；右側可填名稱、答錯提示，零件靠很近時可改「標籤位置」錯開，或按「＋指引線」把圈圈移到空白處、用細線指向物件。</p>
      </div>
      <div>
        <div class="panel">
          <h3>① 底圖</h3>
          <div class="btnrow" style="margin-top:0">
            <button id="btnLoadImg">載入圖片檔（JPG／PNG／SVG）</button>
            <button id="btnPasteSvg">貼上 SVG 程式碼</button>
            <button id="btnSample">載入範例</button>
          </div>
          <input type="file" id="fileImg" accept="image/*,.svg" class="hidden">
          <div id="svgPasteBox" class="hidden">
            <label for="svgCode">SVG 程式碼</label>
            <textarea id="svgCode" placeholder="<svg ...> ... </svg>"></textarea>
            <div class="btnrow"><button class="primary" id="btnUseSvg">使用這段 SVG</button></div>
          </div>
          <p class="tip">照片會自動縮到最長邊 1600px，避免檔案太大。</p>
        </div>

        <div class="panel">
          <h3>② 題目設定</h3>
          <label for="inTitle">標題</label>
          <input type="text" id="inTitle">
          <label for="inInst">作答說明</label>
          <input type="text" id="inInst">
          <label for="inFeedback">回饋方式</label>
          <select id="inFeedback">
            <option value="submit">全部放好後按「檢查」（像 Wordwall）</option>
            <option value="instant">每放一個就立刻判斷</option>
          </select>
          <label for="inSize">圖上文字大小（學生作答時還能自己按 A＋／A− 調整）</label>
          <select id="inSize">
            <option value="m">中</option>
            <option value="l">大（建議）</option>
            <option value="xl">特大（投影用）</option>
          </select>
          <label for="inBack">「回上一頁」找不到上一頁時要去的網址（可留白，例：index.html）</label>
          <input type="text" id="inBack" placeholder="例：index.html">
          <label for="inHome">「回首頁」網址（可留白＝不顯示這個按鈕，例：../index.html）</label>
          <input type="text" id="inHome" placeholder="例：../index.html">
          <label for="inDistract">干擾選項（每行一個，不對應任何圈圈，可留白）</label>
          <textarea id="inDistract"></textarea>
        </div>

        <div class="panel">
          <h3>③ 圈圈與名稱 <span class="tip" id="pinCount"></span></h3>
          <div id="pinList"></div>
        </div>

        <div class="panel">
          <h3>④ 存檔與匯出</h3>
          <div class="btnrow" style="margin-top:0">
            <button class="primary" id="btnExportHtml">匯出作答網頁（.html）</button>
            <button id="btnExportJson">匯出題目檔（.json）</button>
            <button id="btnImportJson">開啟題目檔</button>
            <button id="btnClear">清空重來</button>
          </div>
          <input type="file" id="fileJson" accept=".json,application/json" class="hidden">
          <p class="tip">作答網頁是單一檔案，題目和圖片都包在裡面，可直接放上網站或用 iframe 嵌入簡報。題目檔可以之後再開啟、修改。編輯內容會自動暫存在這個瀏覽器。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= 作答模式 ================= -->
  <section id="playView" class="hidden">
    <div class="play-wrap">
      <div class="stage" id="playStage"></div>
      <aside class="side">
        <h2 id="playTitle"></h2>
        <p class="inst" id="playInst"></p>
        <div class="sizebar"><span class="grp">文字<button id="btnSmaller" aria-label="字變小">A−</button><button id="btnBigger" aria-label="字變大">A＋</button></span>
          <span class="grp">圖片<button id="btnZoomOut" aria-label="圖片縮小">－</button><button id="btnZoomIn" aria-label="圖片放大">＋</button></span></div>
        <div class="bank" id="bank" aria-label="名稱標籤"></div>
        <div class="status" id="status"></div>
        <div class="legend"><span><i style="background:var(--pin)"></i>還沒放</span><span><i style="background:var(--accent)"></i>已放</span><span><i style="background:var(--ok)"></i>答對</span><span><i style="background:var(--bad)"></i>答錯</span></div>
        <div class="btnrow">
          <button class="primary" id="btnCheck">檢查</button>
          <button id="btnReset">重新開始</button>
        </div>
        <ul class="feedback" id="feedback"></ul>
        <div id="doneBox"></div>
      </aside>
    </div>
  </section>
</main>

<!-- 匯出作答頁時，題目資料會寫進這裡 -->

/* 指引線：圈圈放在空白處，細線指到物件上的小圓點 */
function drawLeaders(cv, pins, editable){
  if(!cv) return;
  cv.querySelectorAll('.leaders,.anchor').forEach(n=>n.remove());
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('class','leaders');
  svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none');
  pins.forEach(p=>{
    if(p.ax==null||p.ay==null) return;
    [['#fff',6],['#263238',2.5]].forEach(([c,w])=>{
      const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',p.x); l.setAttribute('y1',p.y); l.setAttribute('x2',p.ax); l.setAttribute('y2',p.ay);
      l.setAttribute('stroke',c); l.setAttribute('stroke-width',w); l.setAttribute('stroke-linecap','round');
      l.setAttribute('vector-effect','non-scaling-stroke'); l.dataset.id=p.id; svg.appendChild(l);
    });
    const a=el('div','anchor'); a.style.left=p.ax+'%'; a.style.top=p.ay+'%'; a.dataset.id=p.id;
    if(editable){ a.title='拖曳：指引線指到的位置'; a.addEventListener('pointerdown',e=>startAnchorDrag(e,p,a)); }
    cv.appendChild(a);
  });
  cv.appendChild(svg);
}
function updateLeader(p){
  document.querySelectorAll(`#editStage .leaders line[data-id="${p.id}"]`).forEach(l=>{
    l.setAttribute('x1',p.x); l.setAttribute('y1',p.y); l.setAttribute('x2',p.ax); l.setAttribute('y2',p.ay); });
}
function startAnchorDrag(e,p,a){
  e.preventDefault(); e.stopPropagation(); setHot(p.id);
  const stage=$('editStage'); let moved=false; a.setPointerCapture(e.pointerId);
  const move=ev=>{ moved=true; const {x,y}=stagePct(stage,ev); p.ax=+x.toFixed(2); p.ay=+y.toFixed(2); a.style.left=p.ax+'%'; a.style.top=p.ay+'%'; updateLeader(p); };
  const up=()=>{ a.removeEventListener('pointermove',move); a.removeEventListener('pointerup',up); a.removeEventListener('pointercancel',up);
    if(moved){ save(); suppressClick=true; setTimeout(()=>suppressClick=false,50); } };
  a.addEventListener('pointermove',move); a.addEventListener('pointerup',up); a.addEventListener('pointercancel',up);
}

function setHot(id){

function stagePct(stage,e){
  const cv = stage.querySelector('.canvas') || stage; const r = cv.getBoundingClientRect();
  return { x:clamp((e.clientX-r.left)/r.width*100,0,100), y:clamp((e.clientY-r.top)/r.height*100,0,100) };
}

/* 文字大小：題目預設 × 學生自己調整的倍率 */
const SIZE_BASE = { m:{fs:17,pin:34}, l:{fs:21,pin:40}, xl:{fs:26,pin:48} };
const USER_KEY = 'labelled-diagram-userscale';
let userStep = 0; try{ userStep = clamp(parseInt(localStorage.getItem(USER_KEY)||'0',10)||0,-2,4); }catch(e){}
function visibleCanvas(){
  const v = !$('playView').classList.contains('hidden') ? $('playStage') : $('editStage');
  return v.querySelector('.canvas');
}
function applySize(){
  const b = SIZE_BASE[data.labelSize]||SIZE_BASE.l;
  const k = 1 + userStep*0.15;
  // 圖片顯示得越窄（手機），標籤跟著縮；圖片放大時字也跟著回來
  const cv = visibleCanvas(); const w = cv ? cv.getBoundingClientRect().width : 0;
  const f = w>0 ? clamp(w/620, 0.7, 1) : 1;
  document.documentElement.style.setProperty('--tag-fs', Math.round(b.fs*k*f)+'px');
  document.documentElement.style.setProperty('--pin-size', Math.round(b.pin*Math.min(k,1.3)*Math.max(f,0.78))+'px');
  fitTags();
  if($('btnSmaller')){ $('btnSmaller').disabled = userStep<=-2; $('btnBigger').disabled = userStep>=4; }
}
/* 標籤碰到圖面邊緣時往內推，避免被切掉 */
function fitTags(){
  const st=$('playStage'); if(!st || $('playView').classList.contains('hidden')) return;
  const box=st.getBoundingClientRect();
  st.querySelectorAll('.tag').forEach(t=>{
    t.style.marginLeft=''; t.style.marginTop='';
    const r=t.getBoundingClientRect(); let dx=0, dy=0;
    const cv=st.querySelector('.canvas'); const c=cv?cv.getBoundingClientRect():box;
    const L=Math.min(box.left,c.left)+3, R=Math.max(box.right,c.right)-3;
    if(r.left<L) dx=L-r.left; else if(r.right>R) dx=R-r.right;
    const T=Math.min(box.top,c.top)+3, B=Math.max(box.bottom,c.bottom)-3;
    if(r.top<T) dy=T-r.top; else if(r.bottom>B) dy=B-r.bottom;
    if(dx) t.style.marginLeft=dx+'px'; if(dy) t.style.marginTop=dy+'px';
  });
}
window.addEventListener('resize',()=>{ applySize(); });
function stepSize(d){ userStep=clamp(userStep+d,-2,4); try{ localStorage.setItem(USER_KEY,String(userStep)); }catch(e){} applySize(); }
$('btnSmaller').onclick=()=>stepSize(-1);
/* 圖片放大：放大後圖面可捲動／用手指拖動 */
const ZOOMS=[1,1.5,2,2.5,3]; let zoomIdx=0;
function applyZoom(){
  const st=$('playStage'); const img=st.querySelector('img.base'); if(!img) return;
  const z=ZOOMS[zoomIdx];
  st.classList.toggle('zoomed', z>1);
  if(z>1){
    const base = Math.min(st.clientWidth, (img.naturalWidth||st.clientWidth));
    img.style.width = Math.round(Math.max(st.clientWidth*0.6, base)*z)+'px';
  } else img.style.width='';
  $('btnZoomOut').disabled = zoomIdx===0; $('btnZoomIn').disabled = zoomIdx===ZOOMS.length-1;
}
function zoomChanged(){ applySize(); }
function stepZoom(d){
  const st=$('playStage'); const sx=st.scrollLeft+st.clientWidth/2, sy=st.scrollTop+st.clientHeight/2;
  const oldW=st.scrollWidth, oldH=st.scrollHeight;
  zoomIdx=clamp(zoomIdx+d,0,ZOOMS.length-1); applyZoom();
  if(st.classList.contains('zoomed')){ st.scrollLeft=sx*st.scrollWidth/oldW-st.clientWidth/2; st.scrollTop=sy*st.scrollHeight/oldH-st.clientHeight/2; }
  zoomChanged();
}
$('btnZoomIn').onclick=()=>stepZoom(1);
$('btnZoomOut').onclick=()=>stepZoom(-1);
$('btnBigger').onclick=()=>stepSize(1);
$('inDistract').oninput=e=>{ data.distractors=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean); save(); };

/* 載入底圖 */
$('btnLoadImg').onclick=()=>$('fileImg').click();
$('fileImg').onchange=e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const isSvg = f.type==='image/svg+xml' || /\.svg$/i.test(f.name);
  const rd=new FileReader();
  if(isSvg){
    rd.onload=()=>setSvg(String(rd.result));
    rd.readAsText(f);
  }else{
    rd.onload=()=>shrinkPhoto(String(rd.result), src=>{ setImage(src); });
    rd.readAsDataURL(f);
  }
};
function shrinkPhoto(src,cb){
  const im=new Image();
  im.onload=()=>{
    const max=1600; let w=im.naturalWidth,h=im.naturalHeight;
    if(Math.max(w,h)<=max && src.length<900000){ cb(src); return; }
    const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.85));
  };
  im.onerror=()=>toast('這張圖片讀不出來，請換一張');
  im.src=src;
}
function setSvg(code){
  code=code.trim();
  if(!/<svg[\s>]/i.test(code)){ toast('找不到 <svg> 標籤'); return; }
  if(!/xmlns=/.test(code)) code=code.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
  // 沒寫寬高的 SVG 在 <img> 裡會縮成 0，依 viewBox 補上
  const open = code.match(/<svg[^>]*>/i)[0];
  if(!/\swidth=/.test(open) || !/\sheight=/.test(open) || /\swidth="\d*%"/.test(open)){
    const vb = open.match(/viewBox=["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/i);
    const w = vb ? vb[1] : 800, h = vb ? vb[2] : 600;
    const fixed = open.replace(/\s(width|height)=["'][^"']*["']/gi,'').replace(/<svg/i,`<svg width="${w}" height="${h}"`);
    code = code.replace(open, fixed);
  }
  setImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code));
}
function setImage(src){
  const hadPins = data.pins.length>0;
  data.image={src}; save(); renderEdit();
  toast(hadPins ? '已換底圖，圈圈位置保留，請確認是否需要調整' : '底圖已載入，點圖面新增圈圈');
}

function download(name,text,type){

function safeName(s){ return (s||'標記圖表').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40); }
function validateForExport(){

/* ================= 作答 ================= */
let chips=[], placed={}, lockedPins={}, selectedChip=null, attempts=0, firstScore=null, finished=false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function playPins(){ return data.pins.filter(p=>p.label.trim()); }

function startPlay(){
  const pins = playPins();
  chips = shuffle(pins.map(p=>({id:'c'+p.id,text:p.label.trim()})).concat(
    data.distractors.map((t,i)=>({id:'d'+i,text:t}))));
  placed={}; lockedPins={}; selectedChip=null; attempts=0; firstScore=null; finished=false;
  for(const k in pinTried) delete pinTried[k];
  $('playTitle').textContent=data.title;
  $('playInst').textContent=data.instruction;
  $('btnCheck').classList.toggle('hidden', data.feedback==='instant');
  $('feedback').textContent=''; $('doneBox').textContent='';
  document.title = data.title;
  applySize();
  renderPlay();
}

function chipById(id){ return chips.find(c=>c.id===id); }
function pinOfChip(cid){ return Object.keys(placed).find(pid=>placed[pid]===cid); }

function renderPlay(marks){
  marks = marks||{};
  const stage=renderStage($('playStage'),{});
  applyZoom();
  drawLeaders(stage, playPins(), false);
  playPins().forEach((p,i)=>{
    let cls='pin';
    if(lockedPins[p.id]) cls+=' ok'; else if(marks[p.id]==='bad') cls+=' bad'; else if(placed[p.id]) cls+=' filled'; else cls+=' todo';
    if(selectedChip && !lockedPins[p.id]) cls+=' target';
    const d=el('div',cls,String(i+1));
    d.style.left=p.x+'%'; d.style.top=p.y+'%'; d.dataset.pin=p.id;
    d.setAttribute('role','button'); d.setAttribute('aria-label','第'+(i+1)+'個圈圈');
    d.onclick=()=>onPinClick(p.id);
    stage.appendChild(d);
    const cid=placed[p.id];
    if(cid){
      const side = p.tag==='above'?' up':p.tag==='left'?' left':p.tag==='right'?' right':p.tag==='below'?'':(p.y>80?' up':'');
      const t=el('div','tag'+side+(lockedPins[p.id]?' ok':(marks[p.id]==='bad'?' bad':'')), chipById(cid).text);
      t.style.left=p.x+'%'; t.style.top=p.y+'%'; t.dataset.pin=p.id;
      if(!lockedPins[p.id]){ t.title='點一下拿回'; t.onclick=()=>{ if(finished) return; delete placed[p.id]; renderPlay(); }; }
      stage.appendChild(t);
    }
  });
  const bank=$('bank'); bank.textContent='';
  chips.filter(c=>!pinOfChip(c.id)).forEach(c=>{
    const b=el('div','chip'+(selectedChip===c.id?' sel':''),c.text);
    b.dataset.chip=c.id; b.setAttribute('role','button'); b.tabIndex=0;
    b.addEventListener('pointerdown',e=>startChipDrag(e,c,b));
    b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectChip(c.id); } });
    bank.appendChild(b);
  });
  if(!bank.children.length) bank.appendChild(el('span','tip','（名稱都放上去了）'));
  updateStatus();
  const im = stage && stage.querySelector('img.base');
  if(im && !im.complete) im.onload=()=>{ applyZoom(); applySize(); }; else applySize();
}

function updateStatus(){
  const pins=playPins(); const n=pins.length;
  const filled=pins.filter(p=>placed[p.id]).length;
  const ok=Object.keys(lockedPins).length;
  let s = `已放 ${filled}／${n}`;
  if(ok) s += `，已答對 ${ok}`;
  if(selectedChip && !finished) s += `　→ 選了「${chipById(selectedChip).text}」，請點圈圈`;
  $('status').textContent=s;
  $('btnCheck').disabled = finished || filled===0;
}

function selectChip(id){ if(finished) return; selectedChip = (selectedChip===id?null:id); renderPlay(); }

function onPinClick(pid){
  if(finished || lockedPins[pid]) return;
  if(!selectedChip){ if(placed[pid]){ delete placed[pid]; renderPlay(); } return; }
  placeChip(selectedChip,pid);
}

function placeChip(cid,pid){
  if(lockedPins[pid]) return;
  const prev=pinOfChip(cid); if(prev) delete placed[prev];
  placed[pid]=cid; selectedChip=null;
  if(data.feedback==='instant') checkOne(pid); else renderPlay();
}

/* 拖曳（同時支援點選） */
function startChipDrag(e,c,node){
  if(finished) return;
  e.preventDefault();
  const sx=e.clientX, sy=e.clientY; let ghost=null, over=null;
  node.setPointerCapture(e.pointerId);
  const hit = ev=>{
    const els=document.elementsFromPoint(ev.clientX,ev.clientY);
    for(const x of els){ if(x.dataset && x.dataset.pin) return x.dataset.pin; }
    // 寬鬆判定：離最近圈圈 40px 內也算
    const stage=$('playStage').querySelector('.canvas').getBoundingClientRect(); let best=null,bd=40;
    playPins().forEach(p=>{ const px=stage.left+p.x/100*stage.width, py=stage.top+p.y/100*stage.height;
      const d=Math.hypot(px-ev.clientX,py-ev.clientY); if(d<bd){bd=d;best=p.id;} });
    return best;
  };
  const move=ev=>{
    if(!ghost && Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
    if(!ghost){ ghost=el('div','ghost',c.text); document.body.appendChild(ghost); node.style.opacity='.35'; }
    ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
    const pid=hit(ev);
    if(pid!==over){
      document.querySelectorAll('#playStage .pin.hot').forEach(x=>x.classList.remove('hot'));
      over=pid;
      if(pid && !lockedPins[pid]){ const pd=document.querySelector(`#playStage .pin[data-pin="${pid}"]`); if(pd) pd.classList.add('hot'); }
    }
  };
  const up=ev=>{
    node.removeEventListener('pointermove',move); node.removeEventListener('pointerup',up); node.removeEventListener('pointercancel',up);
    if(ghost){ ghost.remove(); node.style.opacity='';
      const pid=hit(ev);
      if(pid && !lockedPins[pid]) placeChip(c.id,pid); else renderPlay();
    } else { selectChip(c.id); }
  };
  node.addEventListener('pointermove',move); node.addEventListener('pointerup',up); node.addEventListener('pointercancel',up);
}

function isCorrect(pid){ const p=playPins().find(x=>x.id===pid); const c=chipById(placed[pid]); return p&&c&&c.text===p.label.trim(); }

const pinTried = {};
function checkOne(pid){
  const marks={}; const fb=$('feedback'); fb.textContent='';
  const p=playPins().find(x=>x.id===pid); const idx=playPins().indexOf(p)+1;
  if(isCorrect(pid)){ lockedPins[pid]=true; if(!pinTried[pid]) pinTried[pid]='first'; }
  else{
    pinTried[pid]=pinTried[pid]||'retry';
    marks[pid]='bad';
    const li=el('li'); li.appendChild(el('b',null,`第 ${idx} 號：「${chipById(placed[pid]).text}」不對。`));
    if(p.hint) li.appendChild(el('div','hint','提示：'+p.hint));
    fb.appendChild(li);
    const cid=placed[pid];
    renderPlay(marks);
    setTimeout(()=>{ if(placed[pid]===cid && !lockedPins[pid]){ delete placed[pid]; renderPlay(); } },1100);
    return;
  }
  renderPlay(marks); maybeFinish();
}

$('btnCheck').onclick=()=>{
  if(finished) return;
  attempts++;
  const pins=playPins(); const marks={}; const fb=$('feedback'); fb.textContent='';
  let okNow=0; const wrong=[];
  pins.forEach((p,i)=>{
    if(lockedPins[p.id]){ okNow++; return; }
    if(!placed[p.id]){ wrong.push({p,i,empty:true}); return; }
    if(isCorrect(p.id)){ lockedPins[p.id]=true; okNow++; }
    else { marks[p.id]='bad'; wrong.push({p,i}); }
  });
  if(attempts===1) firstScore={ok:okNow,total:pins.length};
  wrong.forEach(({p,i,empty})=>{
    if(empty) return;
    const li=el('li'); li.appendChild(el('b',null,`第 ${i+1} 號：「${chipById(placed[p.id]).text}」不對。`));
    if(p.hint) li.appendChild(el('div','hint','提示：'+p.hint));
    fb.appendChild(li);
  });
  const emptyCount=wrong.filter(w=>w.empty).length;
  if(emptyCount) fb.appendChild(el('li',null,`還有 ${emptyCount} 個圈圈沒有放名稱。`));
  renderPlay(marks);
  if(wrong.some(w=>!w.empty)){
    setTimeout(()=>{ pins.forEach(p=>{ if(marks[p.id]==='bad') delete placed[p.id]; }); renderPlay(); },1300);
  }
  maybeFinish();
};

function maybeFinish(){
  const pins=playPins();
  if(Object.keys(lockedPins).length<pins.length) return;
  finished=true; selectedChip=null;
  let first, total=pins.length;
  if(data.feedback==='instant') first=pins.filter(p=>pinTried[p.id]==='first').length;
  else first=firstScore?firstScore.ok:total;
  const box=$('doneBox'); box.textContent='';
  const d=el('div','done');
  d.appendChild(el('b',null,'🎉 全部完成！'));
  d.appendChild(el('div',null,`第一次就答對：${first}／${total}`));
  if(data.feedback==='submit') d.appendChild(el('div',null,`共檢查 ${attempts} 次`));
  box.appendChild(d);
  updateStatus();
  try{ window.parent && window.parent!==window && window.parent.postMessage({type:'labelled-diagram-result',title:data.title,firstCorrect:first,total,attempts},'*'); }catch(e){}
}

$('btnReset').onclick=()=>{ for(const k in pinTried) delete pinTried[k]; startPlay(); };

/* ================= 頁面導覽（回上一頁／回首頁） ================= */
function setupNav(){
  if(window.parent!==window) return;            // 嵌在簡報 iframe 裡就不顯示
  $('pageNav').classList.remove('hidden');
  const fallback = data.nav.back || data.nav.home;
  if(data.nav.home){ const a=$('lnkHome'); a.href=data.nav.home; a.classList.remove('hidden'); }
  $('btnBack').onclick=()=>{
    let fromSite=false; try{ fromSite = !!document.referrer && new URL(document.referrer).origin===location.origin && location.origin!=='null'; }catch(e){}
    if(history.length>1 && fromSite){ history.back(); return; }   // 同一分頁從課程網頁點進來：回上一頁
    try{ window.close(); }catch(e){}                  // 新分頁開的：關掉這頁＝回到原本的簡報或補課包
    setTimeout(()=>{ if(fallback) location.href=fallback; else toast('請直接關閉這個分頁回到上一頁'); },300);
  };
}

/* ================= 啟動 ================= */
let preset=null;
try{ const t=$('presetData').textContent.trim(); if(t) preset=JSON.parse(t); }catch(e){}
if(preset && preset.__locked){
  locked=true; data=sanitize(preset);
  $('tabs').classList.add('hidden');
  $('appTitle').textContent=data.title;
  $('editView').classList.add('hidden'); $('playView').classList.remove('hidden');
  setupNav();
  startPlay();
}else{
  data = loadSaved() || sanitize(JSON.parse(JSON.stringify(SAMPLE)));
  if(params.get('mode')==='play' && data.image && playPins().length) showPlay(); else renderEdit();
}
})();
</script>
