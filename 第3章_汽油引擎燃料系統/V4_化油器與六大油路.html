<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V4 化油器與六大油路</title><style>:root{--bg:#0d1526;--panel:#16223a;--panel2:#1d2c4a;--line:#2c3f63;--ink:#e8eef9;--mut:#9fb0cf;--acc:#ffb020;--acc2:#38c6ff;--ok:#3ddc84;--bad:#ff5d5d}

.aopt{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:11px 13px;margin:7px 0;font-size:18px}
.aopt.ok{border-color:var(--ok);background:#143a27}.aopt.bad{border-color:var(--bad);background:#4a1d1d}.aopt:disabled{cursor:default}

.afoot{display:flex;align-items:center;gap:12px;margin-top:14px;justify-content:flex-end}
.amsg{margin-right:auto;font-size:17px;font-weight:700}.amsg.ok{color:var(--ok)}.amsg.bad{color:var(--bad)}
.amut{color:var(--mut);font-size:15px}
.aend{text-align:center;max-width:640px;margin:10px auto;font-size:18px}.astar{font-size:56px}
.aend h3{font-size:26px;margin:6px 0}.abig b{color:var(--acc);font-size:28px}
.atab{margin:10px auto;border-collapse:collapse;min-width:320px}.atab td{border-bottom:1px solid var(--line);padding:6px 14px;text-align:left}
.asend{color:var(--mut)}.asend.ok{color:var(--ok)}
@media(max-width:700px){.amatch{grid-template-columns:1fr}.abins{grid-template-columns:1fr!important}.abin{min-height:80px}}
.alive{min-height:0;margin:0 0 12px;font-weight:700;border-radius:10px}.alive.on{background:#3a2f10;border:2px solid var(--acc);padding:10px 14px;color:var(--acc)}.alive.go{background:#143a27;border:2px solid var(--ok);padding:10px 14px;color:var(--ok)}

<script>
/* 網頁式動畫影片播放框架（共用） */
const W = 960, HGT = 540;
/* 旁白文字：去除標籤、把化學式下標與符號改成好念的文字（預錄 MP3 與瀏覽器語音共用） */
const sayText = s => String(s).replace(/<[^>]+>/g, '')
  .replace(/[₀-₉]/g, d => '0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(d)]).replace(/ₙ/g, 'n').replace(/₊/g, '加').replace(/₋/g, '減')
  .replace(/～/g, '到').replace(/([A-Za-z0-9度])\s*→\s*([A-Za-z0-9])/g, '$1 到 $2').replace(/→/g, '，').replace(/＝/g, '等於').replace(/——/g, '，')
  .replace(/[①②③④⑤⑥⑦⑧⑨]/g, d => '第' + '一二三四五六七八九'['①②③④⑤⑥⑦⑧⑨'.indexOf(d)] + '，').replace(/℃/g, '度C').replace(/°/g, '度').replace(/÷/g, '除以').replace(/[＞>]/g, '大於').replace(/[＜<]/g, '小於').replace(/[－−]/g, '減').replace(/[＋+]/g, '加').replace(/×/g, '乘以').replace(/(\d)x\b/g, '$1倍').replace(/([A-Za-z])\/([A-Za-z])/g, '$1 比 $2').replace(/\s+/g, ' ').trim();
/* 旁白音檔名：FNV-1a 雜湊（建置時與瀏覽器端算法相同） */
const ttsHash = s => { let h = 0x811c9dc5; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
const C = { bg:'#0a1120', ink:'#e8eef9', mut:'#9fb0cf', acc:'#ffb020', acc2:'#38c6ff', ok:'#3ddc84', bad:'#ff5d5d',
  metal:'#8ea3bf', metalD:'#5c6f8a', metalL:'#c3d1e4', wall:'#3a4a66', mix:'#4fd1a5', air:'#7cc7ff', fire:'#ff7a1a', exh:'#8a8f99', oil:'#d8a31a', water:'#2f8fff' };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);
const rad = d => d * Math.PI / 180;
const mod = (a, n) => ((a % n) + n) % n;
/* 0..1 進度 */
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

const H = {
  text(ctx, s, x, y, o = {}) {
    ctx.save(); ctx.font = `${o.bold ? '700 ' : ''}${o.size || 20}px "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif`;
    ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
    ctx.globalAlpha = o.alpha ?? 1;
    String(s).split('\n').forEach((ln, i) => ctx.fillText(ln, x, y + i * (o.size || 20) * 1.35)); ctx.restore();
  },
  rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); },
  box(ctx, x, y, w, h, o = {}) {
    ctx.save(); ctx.globalAlpha = o.alpha ?? 1; H.rr(ctx, x, y, w, h, o.r ?? 10);
    ctx.fillStyle = o.fill || '#16223a'; ctx.fill(); ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke || '#2c3f63'; ctx.stroke(); ctx.restore();
  },
  arrow(ctx, x1, y1, x2, y2, o = {}) {
    ctx.save(); ctx.globalAlpha = o.alpha ?? 1; ctx.strokeStyle = ctx.fillStyle = o.color || C.acc; ctx.lineWidth = o.lw || 4;
    if (o.dash) { ctx.setLineDash(o.dash); ctx.lineDashOffset = o.offset || 0; }
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
    const a = Math.atan2(y2 - y1, x2 - x1), s = o.head || 14;
    ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45));
    ctx.lineTo(x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)); ctx.closePath(); ctx.fill(); ctx.restore();
  },
  label(ctx, px, py, tx, ty, s, o = {}) {
    ctx.save(); ctx.globalAlpha = o.alpha ?? 1; ctx.strokeStyle = o.color || C.acc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = o.color || C.acc; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
    ctx.font = `700 ${o.size || 17}px "Microsoft JhengHei",sans-serif`; const w = ctx.measureText(s).width + 14;
    const left = o.align === 'right' ? tx - w : o.align === 'center' ? tx - w / 2 : tx;
    H.rr(ctx, left, ty - 14, w, 28, 6); ctx.fillStyle = 'rgba(10,17,32,.9)'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.textBaseline = 'middle'; ctx.fillText(s, left + 7, ty + 1); ctx.restore();
  },
  particles(ctx, n, x, y, w, h, color, t, o = {}) {
    ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = o.alpha ?? .85;
    for (let i = 0; i < n; i++) {
      const sx = (Math.sin(i * 12.9898) * 43758.5453) % 1, sy = (Math.sin(i * 78.233) * 12543.21) % 1;
      const px = x + Math.abs(sx) * w + Math.sin(t * 3 + i) * (o.jit ?? 4), py = y + Math.abs(sy) * h + Math.cos(t * 2.6 + i * 1.7) * (o.jit ?? 4);
      if (px < x || px > x + w || py < y || py > y + h) continue;
      ctx.beginPath(); ctx.arc(px, py, o.r || 3.2, 0, 7); ctx.fill();
    }
    ctx.restore();
  },
  spark(ctx, x, y, k) {
    if (k <= 0) return; ctx.save(); ctx.globalAlpha = k; ctx.strokeStyle = '#fff6a0'; ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + k; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 18 * k, y + Math.sin(a) * 18 * k); ctx.stroke(); }
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, 5 * k, 0, 7); ctx.fill(); ctx.restore();
  },
  flame(ctx, x, y, s, t) {
    ctx.save(); for (let i = 0; i < 3; i++) {
      const f = 1 - i * .28; ctx.fillStyle = ['#ff5a1a', '#ff9a1a', '#ffe060'][i]; ctx.beginPath();
      const w = 22 * s * f, h = (46 + Math.sin(t * 10 + i) * 6) * s * f;
      ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w, y - h * .6, x, y - h); ctx.quadraticCurveTo(x + w, y - h * .6, x + w, y); ctx.closePath(); ctx.fill();
    } ctx.restore();
  },
  /* 曲柄滑塊：回傳活塞銷距曲軸中心之距離 */
  pinDist(r, l, th) { return r * Math.cos(th) + Math.sqrt(l * l - (r * Math.sin(th)) ** 2); },
  /* 四行程引擎剖面：phi = 0..720（0 = 進氣行程開始之上死點） */
  engine4(ctx, cx, top, phi, o = {}) {
    const s = o.scale || 1, bore = 150 * s, r = 52 * s, l = 170 * s, headH = 70 * s, clr = 24 * s, crownToPin = 34 * s, pistonH = 70 * s;
    const headBot = top + headH, cy = headBot + clr + crownToPin + r + l, cylBot = headBot + clr + 2 * r + pistonH * .8;
    const th = rad(phi), pinY = cy - H.pinDist(r, l, th), pTop = pinY - crownToPin;
    const IO = o.IO ?? 8, IC = o.IC ?? 40, EO = o.EO ?? 50, EC = o.EC ?? 12;
    const lift = (a, b) => { let p = mod(phi - a, 720), span = mod(b - a, 720); return p <= span ? Math.sin(Math.PI * p / span) : 0; };
    const iL = o.iLift ?? lift(-IO, 180 + IC), eL = o.eLift ?? lift(540 - EO, 720 + EC);
    const x0 = cx - bore / 2, x1 = cx + bore / 2;
    // 汽缸壁與水套
    ctx.save();
    ctx.fillStyle = C.wall; ctx.fillRect(x0 - 34 * s, headBot, 34 * s, cylBot - headBot); ctx.fillRect(x1, headBot, 34 * s, cylBot - headBot);
    if (o.water) { ctx.fillStyle = 'rgba(47,143,255,.55)'; ctx.fillRect(x0 - 26 * s, headBot + 8 * s, 14 * s, (cylBot - headBot) * .6); ctx.fillRect(x1 + 12 * s, headBot + 8 * s, 14 * s, (cylBot - headBot) * .6); }

/* 互學挑戰模組（共用）：classify 分類、match 配對、order 排序、choice 情境選擇

        const g = id => el.querySelector('#' + id), upd = () => { g('rv').textContent = Math.round(S.cam) + '°'; g('au').textContent = S.auto ? '⏸ 停止' : '▶ 自動轉'; g('au').className = S.auto ? 'pri' : ''; g('fl').textContent = S.full ? '浮筒室：已滿' : '浮筒室：未滿'; g('fl').className = S.full ? 'pri' : ''; };
        g('r').oninput = () => { S.cam = +g('r').value; S.auto = false; upd(); }; g('au').onclick = () => { S.auto = !S.auto; upd(); }; g('fl').onclick = () => { S.full = !S.full; upd(); };
        S.tick = () => { g('seen').textContent = S.pseen.length; if (S.auto) { g('r').value = S.cam; g('rv').textContent = Math.round(S.cam) + '°'; } }; upd();
      },
      draw(ctx, t, S) {
        const now = performance.now() / 1000, dt = clamp(now - (S.lt || now), 0, .1); S.lt = now; if (S.auto) S.cam = (S.cam + dt * 72) % 360;
        const th = S.cam * Math.PI / 180, ph = fuelPump(ctx, th, S.full, now);
        /* 手動轉時：用凸輪下一刻的方向判斷吸油／送油 */
        const shown = S.full ? 2 : (Math.sin(th) < 0 ? 0 : 1); if (!S.pseen.includes(shown)) S.pseen.push(shown); pumpText(ctx, shown); if (S.tick) S.tick();
      },
      quiz: { q: '浮筒室已滿時，膜片式汽油泵的狀態是？', opts: ['膜片停在下方，搖臂空動（調節時期）', '膜片持續上下運動，壓力越來越高', '進油閥、出油閥同時打開', '凸輪停止轉動'], ans: 0, ex: '汽油送不出去，膜片被壓在下方，搖臂碰不到拉桿，不再送油。' } },

    { title: '文氏管原理（互動實驗）', loop: true, nominal: 20,
      captions: [[0, '拉動「節氣門開度」：空氣流過文氏管<b>最窄處</b>時速度最快、<b>真空最大</b>，就把浮筒室的汽油吸出來。開越大，空氣越多、吸出的汽油也越多！做完觀察按「完成本段」。', '拉動節氣門開度：空氣流過文氏管最窄處時速度最快、真空最大，就把浮筒室的汽油吸出來。開越大，空氣越多、吸出的汽油也越多！做完觀察，按完成本段。']],
      panel(el, S) {

        <div class="row"><span class="res">文氏管：斷面積 <b>大 → 小 → 大</b>；最小處流速最快、真空最大，高速噴油嘴就裝在這裡。</span></div>
        <div class="row"><button onclick="finishLoop()">完成本段 ✔</button></div></div>`;
        const g = el.querySelector('#th'), v = el.querySelector('#tv'); const upd = () => { S.thr = +g.value; v.textContent = Math.round(S.thr * 100) + '%'; }; g.oninput = upd; upd();

      draw(ctx, t, S) {

        H.text(ctx, S.thr < .15 ? '幾乎關閉：喉部真空小\n→ 由怠速油路供油' : S.thr > .75 ? '大開：空氣多、真空大\n→ 吸出汽油多' : '開度中：空氣與汽油\n成比例增加', 820, 420, { size: 16, align: 'center', color: C.acc });
      },
      quiz: { q: '文氏管中，空氣流速最快、真空最大的位置在？', opts: ['斷面積最小處（喉部）', '入口最寬處', '出口最寬處', '節氣門下方'], ans: 0, ex: '斷面積越小流速越快、真空越大，主（高速）噴油嘴就裝在這裡。' } },

    { title: '化油器的分類', dur: 20,
      captions: [[0, '依文氏管構造：<b>固定喉管式</b>喉管大小不變，靠真空度變化控制油量，又叫<b>可變真空式</b>，大部分化油器屬於這種。'],
        [8, '<b>可變喉管式</b>（SU 型）：喉管大小隨節氣門變化，真空度幾乎不變，又叫<b>固定真空式</b>，靠量油針控制油量。'],
        [14, '依文氏管數目：<b>單管式</b>用於機車、小型車；<b>雙管兩段式</b>的主管節氣門開到 50 度以上，副管才開始作用，增加馬力。', '依文氏管數目：單管式用於機車、小型車；雙管兩段式的主管節氣門開到 50 度以上，副管才開始作用，增加馬力。']],
      draw(ctx, t) {
        const card = (x, y, n, a, b, col, k) => { H.box(ctx, x, y, 400, 170, { stroke: col, alpha: k }); H.text(ctx, n, x + 200, y + 34, { size: 24, bold: true, align: 'center', color: col, alpha: k }); H.text(ctx, a, x + 200, y + 80, { size: 19, align: 'center', alpha: k }); H.text(ctx, b, x + 200, y + 130, { size: 17, align: 'center', color: C.mut, alpha: k }); };
        card(60, 50, '固定喉管式（可變真空式）', '喉管大小不變・靠真空度控制', '大部分化油器屬於此式', C.acc2, ease(prog(t, 0, 1)));
        card(500, 50, '可變喉管式（固定真空式）', 'SU 型・量油針控制油量', '構造簡單、運轉圓滑、容積效率高', C.ok, ease(prog(t, 8, 9)));
        card(60, 280, '單管式', '一只文氏管、節氣門、阻風門', '機車、小型汽車', '#c79bff', ease(prog(t, 14, 15)));
        card(500, 280, '雙管兩段式', '主管開 50° 以上 → 副管才作用', '高速高負荷時增加馬力', C.fire, ease(prog(t, 15, 16)));
      },
      quiz: { q: 'SU 型化油器屬於哪一種？', opts: ['可變喉管式（固定真空式）', '固定喉管式（可變真空式）', '單管式', '電子噴射式'], ans: 0, ex: 'SU 型喉管大小可變，真空度幾乎不變。' } },

    { title: '六大油路總覽', dur: 34,
      captions: [[0, '為了應付各種工況，化油器有<b>六大油路</b>，看看各自在什麼時候工作。'],
        [4, '<b>浮筒油路</b>：貯存汽油、保持油面高度。油面<b>太高混合比變濃、太低變稀</b>。'],
        [10, '<b>怠速及低速油路</b>：節氣門全閉到 1/4 開，混合比 11～13：1。混合比調整螺絲<b>鎖入變稀、放鬆變濃</b>。'],
        [16, '<b>高速油路</b>：節氣門 1/4 開到全開，混合比 14～16：1，由文氏管喉部的高速噴油嘴供油。'],
        [21, '<b>加速油路</b>：猛踩油門的瞬間，大量空氣衝進來會太稀，<b>加速泵</b>趕快補噴一次汽油。'],
        [26, '<b>強力油路</b>：節氣門 3/4 開以上，12～13：1，沒有自己的噴油嘴，汽油從<b>高速噴油嘴</b>噴出。'],
        [30, '<b>阻風油路</b>：冷車時阻風門關閉，高速、低速油路一起供油，8～10：1 最濃。']],
      draw(ctx, t) {
        const seq = [[4, 'float', .3, 0], [10, 'idle', 0, 0], [16, 'high', .5, 0], [21, 'accel', .8, 0], [26, 'power', .95, 0], [30, 'choke', .1, 1]];
        let cur = null; seq.forEach(s => { if (t >= s[0]) cur = s; });
        carb(ctx, cur ? { hl: cur[1], thr: cur[2], choke: cur[3], t } : { thr: .3, t });
        if (cur) { const c = CIRC[cur[1]]; H.box(ctx, 740, 60, 200, 200, { stroke: c[1], fill: '#16223a' }); H.text(ctx, c[0], 840, 95, { size: 20, bold: true, align: 'center', color: c[1] });
          H.text(ctx, c[2].replace('（', '\n（'), 840, 145, { size: 15, align: 'center' }); H.text(ctx, c[3], 840, 225, { size: 20, bold: true, align: 'center', color: C.acc }); }
      },
      quiz: { q: '化油器強力油路作用時，汽油從哪裡噴出？', opts: ['高速噴油嘴', '怠速噴油嘴', '加速噴油嘴', '強力專用噴油嘴'], ans: 0, ex: '強力油路沒有單獨噴油嘴，又稱高速油路的補償油路。' } },

    { title: '油路判斷練習', loop: true, nominal: 20,
      captions: [[0, '換你當修車師傅！按「下一個情境」，再點選右邊這個情境主要由哪一條油路負責。答對 3 題按「完成本段」。', '換你當修車師傅！按下一個情境，再點選右邊這個情境主要由哪一條油路負責。答對三題，按完成本段。']],
      panel(el, S) {
        el.innerHTML = `<div class="box"><div class="row"><button class="pri" id="ns">🔧 下一個情境</button><span class="res" id="sm">按「下一個情境」開始</span></div>
        <div class="row">${Object.entries(CIRC).filter(([k]) => k !== 'float').map(([k, c]) => `<button data-k="${k}" style="border-color:${c[1]}">${c[0]}</button>`).join('')}</div>
        <div class="row"><span style="color:#9fb0cf">已答對 <b id="cnt">0</b> 題</span><button onclick="finishLoop()">完成本段 ✔</button></div></div>`;
        const g = id => el.querySelector('#' + id);
        g('ns').onclick = () => { let s; do { s = SCEN[Math.floor(Math.random() * SCEN.length)]; } while (S.sc && s === S.sc && SCEN.length > 1); S.sc = s; S.pick = null; g('sm').textContent = `情境：${s[0]}`; };
        el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { if (!S.sc || S.pick) return; S.pick = b.dataset.k; const ok = S.pick === S.sc[1];
          if (ok) { S.n++; g('cnt').textContent = S.n; } g('sm').innerHTML = ok ? `<span class="fb ok">✔ 正確！${S.sc[0]} → ${CIRC[S.sc[1]][0]}</span>` : `<span class="fb bad">✘ 再想想（提示：${CIRC[S.sc[1]][2]}）</span>`; if (!ok) S.pick = null; });
      },
      draw(ctx, t, S) {
        const sc = S.sc; carb(ctx, sc && S.pick === sc[1] ? { hl: sc[1], thr: sc[2], choke: sc[3], t } : { thr: sc ? sc[2] : .3, choke: sc ? sc[3] : 0, t });
        H.box(ctx, 740, 60, 200, 200, { stroke: C.acc, fill: '#16223a' }); H.text(ctx, sc ? '目前情境' : '等待情境…', 840, 95, { size: 18, align: 'center', color: C.mut });
        if (sc) H.text(ctx, sc[0].replace('（', '\n（'), 840, 150, { size: 20, bold: true, align: 'center', color: C.acc });
      },
      quiz: { q: '化油器熄火電磁閥不作用時，會堵塞哪一條油路？', opts: ['怠速及低速油路', '高速油路', '加速油路', '強力油路'], ans: 0, ex: '點火開關 OFF 時熄火電磁閥關閉低速油路；若故障，引擎會沒有怠速（放油門即熄火）。' } },
  ],
  activity: {
    title: '第 4 節｜化油器維修站',
    rounds: [
      { type: 'order', title: '化油器式燃料系統流程', items: ['油箱', '汽油濾清器', '汽油泵', '化油器', '引擎'] },
      { type: 'match', title: '工況 × 油路配對', pairs: [['保持浮筒室油面高度', '浮筒油路'], ['停紅燈怠速', '怠速及低速油路'], ['平路中高速巡航', '高速油路'], ['猛踩油門的瞬間', '加速油路'], ['滿載爬陡坡（3/4 以上）', '強力油路'], ['冷車早上發動', '阻風油路']] },
      { type: 'classify', title: '機械式 or 電動式汽油泵？', bins: ['機械式（膜片式）', '電動式'],
        items: [['由凸輪軸帶動', 0], ['膜片上下運動吸油、送油', 0], ['有吸油、送油、調節三個時期', 0], ['馬達＋滾子泵', 1], ['點火開關 ON 就能先供油', 1], ['可裝在溫度較低處減少氣阻', 1], ['多用於汽油噴射系統', 1]] },
      { type: 'choice', title: '維修站判斷題', qs: [
        ['浮筒室油面調得太高，混合比會？', ['變濃', '變稀', '不變', '先稀後濃'], '油面太高變濃、太低變稀。'],
        ['怠速混合比調整螺絲「鎖入」，混合比會？', ['變稀', '變濃', '不變', '引擎熄火'], '鎖入孔徑變小、噴油減少 → 變稀。'],
        ['猛踩油門時引擎遲滯、化油器回火，最可能哪一條油路故障？', ['加速油路', '阻風油路', '浮筒油路', '怠速油路'], '加速泵不噴油 → 瞬間過稀。'],
        ['文氏管喉部的空氣流速與真空度為何？', ['流速最快、真空最大', '流速最慢、真空最小', '流速最快、真空最小', '和其他位置一樣'], '斷面積最小處流速最快、真空最大。']] },
    ],
  },
};
